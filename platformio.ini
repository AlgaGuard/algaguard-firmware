; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
build_flags =
  -D ALGAGUARD_MQTT_MAX_BATCH_SAMPLES=120
  -D ALGAGUARD_QUEUE_MAX_SAMPLES=1440
  -D ALGAGUARD_REPLAY_MAX_BATCHES=4
  -D ALGAGUARD_REPLAY_MAX_SAMPLES=480
  -D ALGAGUARD_MQTT_DUPLICATE_MAX_RETRIES=3
  -D ALGAGUARD_OTA_MAX_ARTIFACT_BYTES=4194304
  -D ALGAGUARD_OTA_MAX_MANIFEST_BYTES=65536
  -D ALGAGUARD_CREDENTIAL_MAX_CERT_BYTES=4096
  -D ALGAGUARD_CREDENTIAL_MAX_CHAIN_BYTES=12288
  -D ALGAGUARD_CREDENTIAL_MAX_CSR_BYTES=4096
  -D ALGAGUARD_CREDENTIAL_MAX_UNSYNCED_HOLDOVER_SECONDS=86400

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 16MB
board_build.sdkconfig_defaults = sdkconfig.defaults
monitor_speed = 115200
build_flags =
  ${env.build_flags}
  -D ALGAGUARD_USB_POWER_ONLY=1
  -D CONFIG_ESP_TASK_WDT_EN=1
check_tool = cppcheck
check_flags = --enable=warning,style,performance

[env:native]
platform = native
test_framework = unity
build_flags =
  ${env.build_flags}
  -std=gnu++17
test_build_src = false
