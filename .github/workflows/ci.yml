name: Firmware Development Artifact CI

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

env:
  PLATFORMIO_CORE_DIR: ${{ github.workspace }}/.platformio-core

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: python -m pip install platformio pytest
      - name: Security profile guard scenarios
        run: python tools/security_profile_guard_runner.py
      - name: Security profile guard tests
        run: python -m pytest test/test_security_profile_guard_runner.py -q
      - name: Artifact security tests
        run: python -m pytest test/test_artifact_security.py -q
      - name: Native regression tests
        run: pio test -e native
      - name: Partition validator regression tests
        run: python test/test_partition_validation.py
      - name: Static analysis
        run: |
          sudo apt-get update
          sudo apt-get install --yes cppcheck
          cppcheck \
            --enable=warning,style,performance \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=knownConditionTrueFalse:src/secure_identity.cpp:158 \
            --suppress=knownConditionTrueFalse:src/secure_identity.cpp:230 \
            --suppress=knownConditionTrueFalse:src/secure_identity_compile_proof.cpp:11 \
            --std=c++17 \
            include src
      - name: Contract fixture guard
        run: grep -R 'SIMULATED\|NTP_SYNCED\|application' include test
      - name: Verify source diff policy
        run: |
          git diff --check
          git diff --exit-code

  build-development-firmware:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp32-s3-devkitc-1
          - esp32-s3-dev-software-key
          - esp32-s3-dev-software-identity-self-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build exact matrix environment
        run: pio run -e "${{ matrix.environment }}"
      - name: Scan and classify firmware before transfer
        run: |
          firmware=".pio/build/${{ matrix.environment }}/firmware.bin"
          test -s "$firmware"
          python tools/artifact_security.py \
            --environment "${{ matrix.environment }}" \
            "$firmware"
      - name: Prepare firmware-only transfer directory
        run: |
          firmware=".pio/build/${{ matrix.environment }}/firmware.bin"
          transfer="ci-transfer/${{ matrix.environment }}"
          mkdir -p "$transfer"
          cp "$firmware" "$transfer/firmware.bin"
          test -s "$transfer/firmware.bin"
          test "$(find "$transfer" -type f | wc -l)" -eq 1
      - name: Transfer scanned development firmware
        uses: actions/upload-artifact@v4
        with:
          name: scanned-development-firmware-${{ matrix.environment }}
          path: ci-transfer/${{ matrix.environment }}/firmware.bin
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  aggregate-development-firmware:
    needs: [validate, build-development-firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download default development firmware
        uses: actions/download-artifact@v4
        with:
          name: scanned-development-firmware-esp32-s3-devkitc-1
          path: ci-transfer-downloads/scanned-development-firmware-esp32-s3-devkitc-1
      - name: Download insecure development identity firmware
        uses: actions/download-artifact@v4
        with:
          name: scanned-development-firmware-esp32-s3-dev-software-key
          path: ci-transfer-downloads/scanned-development-firmware-esp32-s3-dev-software-key
      - name: Download development identity self-test firmware
        uses: actions/download-artifact@v4
        with:
          name: scanned-development-firmware-esp32-s3-dev-software-identity-self-test
          path: ci-transfer-downloads/scanned-development-firmware-esp32-s3-dev-software-identity-self-test
      - name: Reject transfer omissions and extras
        run: >-
          python tools/ci_development_artifacts.py reconstruct
          --transfer-root ci-transfer-downloads
          --repo-root .
      - name: Rescan and classify reconstructed firmware
        run: |
          python tools/artifact_security.py --environment esp32-s3-devkitc-1 \
            .pio/build/esp32-s3-devkitc-1/firmware.bin
          python tools/artifact_security.py --environment esp32-s3-dev-software-key \
            .pio/build/esp32-s3-dev-software-key/firmware.bin
          python tools/artifact_security.py --environment esp32-s3-dev-software-identity-self-test \
            .pio/build/esp32-s3-dev-software-identity-self-test/firmware.bin
      - name: Stage deterministic development artifact set
        run: python tools/stage_development_artifacts.py --repo-root .
      - name: Verify manifest report and final allowlist
        run: >-
          python tools/ci_development_artifacts.py verify-staged
          --staging-directory .pio/artifacts/firmware-development-unsigned
      - name: Upload final development artifact set
        uses: actions/upload-artifact@v4
        with:
          name: firmware-development-unsigned
          path: .pio/artifacts/firmware-development-unsigned/
          if-no-files-found: error
          # Required because the allowlisted staging root is below .pio.
          include-hidden-files: true
          retention-days: 7
